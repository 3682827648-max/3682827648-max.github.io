<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>祝妈妈母亲节快乐</title>
    <style>
        :root {
            /* ========== 莫兰迪温柔深色系调色盘 ========== */
            --bg-deep: #1c1816;
            --bg-warm: #241e1b;
            --rose-dust: #2d1f1f;
            --mauve-mist: #221c1a;
            --cream-warm: #f0e6df;
            --blush-soft: #d4beb6;
            --champagne: #d9cbc0;
            --milk-coffee: #c4b0a0;
            --gold-muted: #b8a090;
            --gold-warm: rgba(190, 155, 130, 0.35);
            --pink-morandi: #c4a8a0;
            --white-soft: #f5ede8;
            --text-primary: #efe6df;
            --text-secondary: #d4c8bf;
            --text-muted: #b8a89e;
            --card-bg: rgba(245, 235, 225, 0.06);
            --card-bg-hover: rgba(245, 235, 225, 0.09);
            --card-border: rgba(220, 195, 175, 0.2);
            --card-border-glow: rgba(210, 175, 150, 0.35);
            --highlight: rgba(255, 245, 238, 0.4);
            --glass-blur: 18px;
            --glass-saturation: 1.3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ========== 基础页面设置 ========== */
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', 'STHeiti', sans-serif;
            background: var(--bg-deep);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
        }

        /* ========== 流动渐变背景层 ========== */
        .bg-gradient-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 25% 30%, rgba(180, 140, 120, 0.18) 0%, transparent 55%),
                radial-gradient(ellipse at 70% 20%, rgba(200, 160, 140, 0.13) 0%, transparent 50%),
                radial-gradient(ellipse at 40% 65%, rgba(170, 130, 110, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 75% 70%, rgba(190, 150, 130, 0.12) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 50%, rgba(140, 100, 80, 0.08) 0%, transparent 70%),
                linear-gradient(175deg, #1c1816 0%, #1f1a17 15%, #221c19 30%, #1e1816 50%, #201b18 65%, #1b1715 80%, #1d1916 100%);
            background-size: 180% 180%, 160% 160%, 200% 200%, 170% 170%, 150% 150%, 100% 100%;
            animation: bgFlow 28s ease-in-out infinite;
            will-change: background-position;
        }

        @keyframes bgFlow {
            0%,
            100% {
                background-position: 0% 0%, 100% 0%, 50% 100%, 0% 50%, 100% 50%, 0% 0%;
            }
            20% {
                background-position: 30% 15%, 80% 20%, 40% 70%, 15% 40%, 85% 60%, 0% 0%;
            }
            40% {
                background-position: 15% 35%, 60% 10%, 55% 55%, 25% 60%, 70% 40%, 0% 0%;
            }
            60% {
                background-position: 40% 10%, 75% 30%, 35% 75%, 10% 45%, 90% 55%, 0% 0%;
            }
            80% {
                background-position: 20% 25%, 85% 15%, 50% 60%, 20% 35%, 75% 50%, 0% 0%;
            }
        }

        /* ========== Canvas粒子星光层 ========== */
        #particles-canvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* ========== 柔光光斑层 ========== */
        .soft-light-orbs {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }
        .soft-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.18;
            will-change: transform;
        }
        .soft-orb:nth-child(1) {
            width: 35vw;
            height: 35vw;
            max-width: 500px;
            max-height: 500px;
            background: radial-gradient(circle, rgba(220, 185, 160, 0.7) 0%, transparent 70%);
            top: 8%;
            left: 10%;
            animation: orbFloat1 18s ease-in-out infinite;
        }
        .soft-orb:nth-child(2) {
            width: 28vw;
            height: 28vw;
            max-width: 380px;
            max-height: 380px;
            background: radial-gradient(circle, rgba(200, 170, 150, 0.55) 0%, transparent 70%);
            top: 45%;
            right: 5%;
            animation: orbFloat2 22s ease-in-out infinite;
        }
        .soft-orb:nth-child(3) {
            width: 22vw;
            height: 22vw;
            max-width: 300px;
            max-height: 300px;
            background: radial-gradient(circle, rgba(235, 210, 190, 0.5) 0%, transparent 70%);
            bottom: 12%;
            left: 25%;
            animation: orbFloat3 20s ease-in-out infinite;
        }
        .soft-orb:nth-child(4) {
            width: 18vw;
            height: 18vw;
            max-width: 240px;
            max-height: 240px;
            background: radial-gradient(circle, rgba(210, 180, 160, 0.45) 0%, transparent 70%);
            top: 55%;
            left: 55%;
            animation: orbFloat4 24s ease-in-out infinite;
        }

        @keyframes orbFloat1 {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(6vw, 3vh) scale(1.15);
            }
            50% {
                transform: translate(2vw, -4vh) scale(0.9);
            }
            75% {
                transform: translate(-3vw, 5vh) scale(1.08);
            }
        }
        @keyframes orbFloat2 {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            30% {
                transform: translate(-5vw, -4vh) scale(1.12);
            }
            60% {
                transform: translate(3vw, 6vh) scale(0.88);
            }
            85% {
                transform: translate(-2vw, -2vh) scale(1.05);
            }
        }
        @keyframes orbFloat3 {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            35% {
                transform: translate(4vw, -5vh) scale(1.1);
            }
            65% {
                transform: translate(-4vw, 3vh) scale(0.92);
            }
        }
        @keyframes orbFloat4 {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            40% {
                transform: translate(-3vw, 5vh) scale(1.08);
            }
            70% {
                transform: translate(5vw, -3vh) scale(0.94);
            }
        }

        /* ========== 飘落花瓣层 ========== */
        .petals-layer {
            position: fixed;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            overflow: hidden;
        }
        .petal {
            position: absolute;
            top: -60px;
            border-radius: 50% 0 50% 0;
            opacity: 0;
            will-change: transform, opacity;
            animation: petalFall var(--fall-duration) var(--fall-delay) ease-in-out infinite;
        }
        @keyframes petalFall {
            0% {
                transform: translateY(-8vh) translateX(0) rotate(0deg) scale(0.6);
                opacity: 0;
            }
            8% {
                opacity: 0.75;
                transform: translateY(2vh) translateX(var(--drift-1)) rotate(var(--rot-1)) scale(0.85);
            }
            25% {
                opacity: 0.7;
                transform: translateY(22vh) translateX(var(--drift-2)) rotate(var(--rot-2)) scale(1);
            }
            50% {
                opacity: 0.55;
                transform: translateY(48vh) translateX(var(--drift-3)) rotate(var(--rot-3)) scale(0.9);
            }
            75% {
                opacity: 0.35;
                transform: translateY(72vh) translateX(var(--drift-4)) rotate(var(--rot-4)) scale(0.75);
            }
            92% {
                opacity: 0.12;
                transform: translateY(95vh) translateX(var(--drift-5)) rotate(var(--rot-5)) scale(0.5);
            }
            100% {
                transform: translateY(108vh) translateX(var(--drift-6)) rotate(var(--rot-6)) scale(0.3);
                opacity: 0;
            }
        }

        /* ========== 主内容容器 ========== */
        .main-content {
            position: fixed;
            inset: 0;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: clamp(20px, 4vh, 40px) clamp(16px, 3vw, 40px);
            pointer-events: none;
        }

        /* ========== 顶部标题区 ========== */
        .title-section {
            text-align: center;
            margin-bottom: clamp(16px, 3vh, 28px);
            animation: fadeInUp 2.2s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
            opacity: 0;
            animation-delay: 0.3s;
        }
        .main-title {
            font-family: 'Georgia', 'STSong', 'Songti SC', 'Noto Serif SC', 'SimSun', 'KaiTi', serif;
            font-size: clamp(2rem, 5.5vw, 4.2rem);
            font-weight: 400;
            letter-spacing: 0.04em;
            color: var(--white-soft);
            text-align: center;
            line-height: 1.35;
            margin: 0;
            /* 渐变文字填充 */
            background: linear-gradient(180deg,
                    #fdf5ef 0%,
                    #f0e2d6 25%,
                    #e8d5c4 50%,
                    #f2e3d5 75%,
                    #fdf7f2 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            /* 柔和发光 */
            filter: drop-shadow(0 0 18px rgba(230, 200, 175, 0.5)) drop-shadow(0 0 40px rgba(210, 170, 140, 0.3)) drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
            /* 缓慢悬浮 */
            animation: titleFloat 5.5s ease-in-out infinite;
            animation-delay: 2.5s;
            will-change: transform, filter;
        }
        @keyframes titleFloat {
            0%,
            100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-5px);
            }
            60% {
                transform: translateY(-2px);
            }
            85% {
                transform: translateY(-4px);
            }
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========== 副标题文案 ========== */
        .subtitle-section {
            text-align: center;
            max-width: 620px;
            margin-bottom: clamp(20px, 4vh, 36px);
            animation: fadeInUp 2.2s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
            opacity: 0;
            animation-delay: 0.7s;
        }
        .subtitle-text {
            font-size: clamp(0.95rem, 1.6vw, 1.2rem);
            color: var(--text-secondary);
            line-height: 1.9;
            letter-spacing: 0.03em;
            text-align: center;
            font-weight: 300;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
        }
        .subtitle-text .highlight-phrase {
            color: #e8d3c4;
            font-weight: 400;
            letter-spacing: 0.05em;
        }

        /* ========== 液态玻璃卡片区域 ========== */
        .glass-card-wrapper {
            position: relative;
            width: clamp(300px, 65vw, 580px);
            max-width: 92vw;
            pointer-events: auto;
            animation: fadeInUp 2.4s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
            opacity: 0;
            animation-delay: 1.1s;
            /* 呼吸浮动 */
            animation-name: fadeInUp, cardBreathe;
            animation-duration: 2.4s, 5.5s;
            animation-delay: 1.1s, 3.5s;
            animation-timing-function: cubic-bezier(0.22, 0.61, 0.36, 1), ease-in-out;
            animation-fill-mode: forwards, none;
            animation-iteration-count: 1, infinite;
            will-change: transform, box-shadow;
        }
        @keyframes cardBreathe {
            0%,
            100% {
                transform: translateY(0);
                box-shadow:
                    0 8px 40px rgba(0, 0, 0, 0.35),
                    0 2px 12px rgba(200, 160, 130, 0.15),
                    0 0 0 1px var(--card-border),
                    inset 0 1px 0 rgba(255, 245, 235, 0.08);
            }
            40% {
                transform: translateY(-7px);
                box-shadow:
                    0 14px 50px rgba(0, 0, 0, 0.38),
                    0 4px 20px rgba(200, 160, 130, 0.22),
                    0 0 0 1.5px var(--card-border-glow),
                    inset 0 1px 0 rgba(255, 245, 235, 0.12);
            }
            70% {
                transform: translateY(-3px);
                box-shadow:
                    0 10px 44px rgba(0, 0, 0, 0.36),
                    0 3px 16px rgba(200, 160, 130, 0.18),
                    0 0 0 1.2px var(--card-border),
                    inset 0 1px 0 rgba(255, 245, 235, 0.09);
            }
        }

        /* 渐变流光边框（伪元素） */
        .glass-card-wrapper::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 22px;
            z-index: -1;
            background: conic-gradient(from var(--border-angle, 0deg) at 50% 50%,
                    rgba(210, 175, 150, 0.5) 0%,
                    rgba(190, 150, 125, 0.25) 15%,
                    rgba(230, 200, 175, 0.55) 30%,
                    rgba(180, 140, 115, 0.2) 45%,
                    rgba(220, 185, 160, 0.5) 60%,
                    rgba(195, 155, 130, 0.3) 75%,
                    rgba(210, 175, 150, 0.5) 100%);
            filter: blur(6px);
            opacity: 0.7;
            animation: borderGlowRotate 8s linear infinite;
            will-change: background, opacity;
        }
        .glass-card-wrapper::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 21px;
            z-index: -1;
            background: conic-gradient(from var(--border-angle, 0deg) at 50% 50%,
                    rgba(240, 215, 195, 0.6) 0%,
                    rgba(200, 165, 140, 0.3) 20%,
                    rgba(245, 220, 200, 0.55) 40%,
                    rgba(190, 150, 125, 0.25) 60%,
                    rgba(235, 205, 180, 0.5) 80%,
                    rgba(240, 215, 195, 0.6) 100%);
            filter: blur(1.5px);
            opacity: 0.55;
            animation: borderGlowRotate 8s linear infinite reverse;
        }
        @keyframes borderGlowRotate {
            from {
                --border-angle: 0deg;
            }
            to {
                --border-angle: 360deg;
            }
        }
        @property --border-angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        /* 主卡片 */
        .glass-card {
            position: relative;
            background: var(--card-bg);
            backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturation));
            -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturation));
            border-radius: 20px;
            padding: clamp(28px, 4vw, 42px) clamp(24px, 3.5vw, 38px);
            z-index: 1;
            overflow: hidden;
            box-shadow:
                0 8px 40px rgba(0, 0, 0, 0.35),
                0 2px 12px rgba(200, 160, 130, 0.15),
                0 0 0 1px var(--card-border),
                inset 0 1px 0 rgba(255, 245, 235, 0.08);
            transition: box-shadow 0.8s ease;
        }

        /* 卡片顶部高光折射条 */
        .glass-card::before {
            content: '';
            position: absolute;
            top: 8%;
            left: 10%;
            width: 60%;
            height: 22%;
            background: radial-gradient(ellipse at center,
                    rgba(255, 248, 240, 0.22) 0%,
                    rgba(255, 240, 230, 0.08) 40%,
                    transparent 70%);
            border-radius: 50%;
            filter: blur(18px);
            z-index: 2;
            pointer-events: none;
            animation: highlightShift 7s ease-in-out infinite;
            will-change: transform, opacity;
        }
        @keyframes highlightShift {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
                opacity: 0.7;
            }
            30% {
                transform: translate(8%, -5%) scale(1.2);
                opacity: 0.9;
            }
            60% {
                transform: translate(-4%, 8%) scale(0.85);
                opacity: 0.55;
            }
            85% {
                transform: translate(3%, -3%) scale(1.1);
                opacity: 0.75;
            }
        }

        /* 卡片底部柔光 */
        .glass-card::after {
            content: '';
            position: absolute;
            bottom: 5%;
            right: 8%;
            width: 40%;
            height: 18%;
            background: radial-gradient(ellipse at center,
                    rgba(220, 190, 165, 0.15) 0%,
                    rgba(200, 170, 145, 0.05) 50%,
                    transparent 70%);
            border-radius: 50%;
            filter: blur(20px);
            z-index: 2;
            pointer-events: none;
            animation: softGlowShift 9s ease-in-out infinite;
        }
        @keyframes softGlowShift {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
                opacity: 0.5;
            }
            40% {
                transform: translate(-10%, 6%) scale(1.3);
                opacity: 0.7;
            }
            75% {
                transform: translate(6%, -8%) scale(0.8);
                opacity: 0.35;
            }
        }

        /* 卡片内流体光斑1 */
        .fluid-orb-1 {
            position: absolute;
            width: 45%;
            height: 35%;
            top: 25%;
            left: 20%;
            background: radial-gradient(ellipse at center,
                    rgba(235, 210, 190, 0.13) 0%,
                    rgba(210, 180, 155, 0.04) 45%,
                    transparent 70%);
            border-radius: 50%;
            filter: blur(25px);
            z-index: 1;
            pointer-events: none;
            animation: fluidDrift1 8s ease-in-out infinite;
            will-change: transform;
        }
        @keyframes fluidDrift1 {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(12%, -8%) scale(1.25);
            }
            50% {
                transform: translate(-6%, 10%) scale(0.8);
            }
            75% {
                transform: translate(8%, 4%) scale(1.15);
            }
        }

        /* 卡片内流体光斑2 */
        .fluid-orb-2 {
            position: absolute;
            width: 35%;
            height: 28%;
            bottom: 18%;
            right: 15%;
            background: radial-gradient(ellipse at center,
                    rgba(245, 220, 200, 0.1) 0%,
                    rgba(220, 190, 165, 0.03) 50%,
                    transparent 70%);
            border-radius: 50%;
            filter: blur(22px);
            z-index: 1;
            pointer-events: none;
            animation: fluidDrift2 10s ease-in-out infinite;
            will-change: transform;
        }
        @keyframes fluidDrift2 {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            30% {
                transform: translate(-14%, 7%) scale(1.3);
            }
            55% {
                transform: translate(5%, -9%) scale(0.75);
            }
            80% {
                transform: translate(-3%, -4%) scale(1.1);
            }
        }

        /* 卡片内容 */
        .card-content {
            position: relative;
            z-index: 3;
            text-align: center;
        }
        .card-quote {
            font-family: 'Georgia', 'STSong', 'Songti SC', 'Noto Serif SC', 'KaiTi', serif;
            font-size: clamp(1.15rem, 2vw, 1.55rem);
            color: #efe0d4;
            letter-spacing: 0.05em;
            line-height: 1.8;
            margin-bottom: clamp(14px, 2vh, 22px);
            font-weight: 400;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
            transition: color 0.6s ease;
        }
        .card-message {
            font-size: clamp(0.9rem, 1.4vw, 1.05rem);
            color: var(--text-muted);
            letter-spacing: 0.04em;
            line-height: 1.85;
            font-weight: 300;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }
        .card-divider {
            width: 50px;
            height: 1px;
            background: linear-gradient(90deg,
                    transparent,
                    rgba(200, 170, 145, 0.5) 30%,
                    rgba(220, 185, 155, 0.6) 50%,
                    rgba(200, 170, 145, 0.5) 70%,
                    transparent);
            margin: clamp(14px, 2vh, 20px) auto;
            border-radius: 1px;
            animation: dividerPulse 4s ease-in-out infinite;
        }
        @keyframes dividerPulse {
            0%,
            100% {
                opacity: 0.5;
                width: 50px;
            }
            50% {
                opacity: 0.85;
                width: 70px;
            }
        }

        /* ========== 底部落款 ========== */
        .footer-section {
            text-align: center;
            margin-top: clamp(18px, 3.5vh, 30px);
            animation: fadeInUp 2.2s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
            opacity: 0;
            animation-delay: 1.5s;
        }
        .footer-text {
            font-family: 'Georgia', 'STSong', 'Songti SC', 'Noto Serif SC', 'KaiTi', serif;
            font-size: clamp(0.9rem, 1.4vw, 1.1rem);
            color: #c8b8a8;
            letter-spacing: 0.06em;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
            line-height: 1.7;
        }
        .footer-heart {
            display: inline-block;
            animation: heartBeat 2.5s ease-in-out infinite;
            color: #d4b5a0;
            margin: 0 4px;
            font-style: normal;
        }
        @keyframes heartBeat {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.7;
            }
            15% {
                transform: scale(1.18);
                opacity: 1;
            }
            30% {
                transform: scale(1);
                opacity: 0.7;
            }
            45% {
                transform: scale(1.14);
                opacity: 0.9;
            }
            60% {
                transform: scale(1);
                opacity: 0.7;
            }
        }

        /* ========== 页面入场渐显 ========== */
        .page-entrance {
            animation: pageReveal 2s ease-out forwards;
            opacity: 0;
        }
        @keyframes pageReveal {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* ========== 响应式适配 ========== */
        @media (max-width: 768px) {
            :root {
                --glass-blur: 14px;
                --glass-saturation: 1.2;
            }
            .glass-card {
                border-radius: 16px;
                padding: clamp(22px, 4vw, 30px) clamp(18px, 3vw, 26px);
            }
            .glass-card-wrapper::before {
                border-radius: 18px;
                inset: -1.5px;
                filter: blur(5px);
            }
            .glass-card-wrapper::after {
                border-radius: 17px;
                inset: -0.5px;
                filter: blur(1px);
            }
            .soft-orb {
                filter: blur(50px);
                opacity: 0.12;
            }
            .soft-orb:nth-child(1) {
                width: 45vw;
                height: 45vw;
            }
            .soft-orb:nth-child(2) {
                width: 38vw;
                height: 38vw;
            }
            .soft-orb:nth-child(3) {
                width: 30vw;
                height: 30vw;
            }
            .soft-orb:nth-child(4) {
                width: 25vw;
                height: 25vw;
            }
            .main-title {
                filter: drop-shadow(0 0 12px rgba(230, 200, 175, 0.45)) drop-shadow(0 0 28px rgba(210, 170, 140, 0.25)) drop-shadow(0 1px 3px rgba(0, 0, 0, 0.3));
            }
        }
        @media (max-width: 480px) {
            :root {
                --glass-blur: 10px;
                --glass-saturation: 1.1;
            }
            .glass-card {
                border-radius: 14px;
                padding: clamp(18px, 5vw, 24px) clamp(14px, 4vw, 20px);
            }
            .glass-card-wrapper::before {
                border-radius: 16px;
                inset: -1px;
                filter: blur(4px);
                opacity: 0.55;
            }
            .glass-card-wrapper::after {
                border-radius: 15px;
                inset: -0.5px;
                filter: blur(0.8px);
                opacity: 0.4;
            }
            .soft-orb {
                filter: blur(35px);
                opacity: 0.09;
            }
            .main-title {
                font-size: clamp(1.6rem, 7vw, 2.2rem);
                filter: drop-shadow(0 0 10px rgba(230, 200, 175, 0.4)) drop-shadow(0 0 20px rgba(210, 170, 140, 0.2)) drop-shadow(0 1px 2px rgba(0, 0, 0, 0.3));
            }
            .subtitle-text {
                font-size: 0.85rem;
                line-height: 1.7;
            }
            .card-quote {
                font-size: 1rem;
            }
            .card-message {
                font-size: 0.82rem;
            }
            .footer-text {
                font-size: 0.82rem;
            }
            .petal {
                animation-duration: calc(var(--fall-duration) * 1.4);
            }
        }
    </style>
</head>
<body>

    <!-- ==================== 背景流动渐变层 ==================== -->
    <div class="bg-gradient-layer" aria-hidden="true"></div>

    <!-- ==================== Canvas粒子星光层 ==================== -->
    <canvas id="particles-canvas" aria-hidden="true"></canvas>

    <!-- ==================== 柔光光斑层 ==================== -->
    <div class="soft-light-orbs" aria-hidden="true">
        <div class="soft-orb"></div>
        <div class="soft-orb"></div>
        <div class="soft-orb"></div>
        <div class="soft-orb"></div>
    </div>

    <!-- ==================== 飘落花瓣层 ==================== -->
    <div class="petals-layer" id="petalsLayer" aria-hidden="true"></div>

    <!-- ==================== 主内容区 ==================== -->
    <main class="main-content" id="mainContent">
        <!-- 顶部大标题 -->
        <header class="title-section">
            <h1 class="main-title">祝妈妈 母亲节快乐</h1>
        </header>

        <!-- 副标题文案 -->
        <section class="subtitle-section">
            <p class="subtitle-text">
                岁月在您的掌心留下<span class="highlight-phrase">温柔的纹路</span>，<br>却在我的生命里<span class="highlight-phrase">铺满了光</span>。<br>那些无声的守护、深夜的等候、<br>不求回报的给予——<br>是您用平凡的日子，<br>编织了我生命中最<span class="highlight-phrase">不平凡的港湾</span>。
            </p>
        </section>

        <!-- 液态玻璃卡片 -->
        <div class="glass-card-wrapper" id="glassCardWrapper">
            <div class="glass-card" id="glassCard">
                <!-- 流体光斑 -->
                <div class="fluid-orb-1"></div>
                <div class="fluid-orb-2"></div>
                <!-- 卡片内容 -->
                <div class="card-content">
                    <p class="card-quote">「您陪我长大，我陪您变老」</p>
                    <div class="card-divider"></div>
                    <p class="card-message">
                        世间最温柔的词，是<strong>妈妈</strong><br>
                        时光慢些吧，让我多爱您一些<br>
                        每一个平凡的日子<br>
                        都因您的存在而闪闪发光
                    </p>
                </div>
            </div>
        </div>

        <!-- 底部落款 -->
        <footer class="footer-section">
            <p class="footer-text">
                时光慢一点，爱您多一点<span class="footer-heart">&#9829;</span><br>愿妈妈永远平安喜乐
            </p>
        </footer>
    </main>

    <script>
        (function() {
            // ==================== Canvas 粒子星光系统 ====================
            const canvas = document.getElementById('particles-canvas');
            const ctx = canvas.getContext('2d');
            let particles = [];
            let animationId;
            const PARTICLE_COUNT = 55;
            let canvasWidth, canvasHeight;

            function resizeCanvas() {
                canvasWidth = window.innerWidth;
                canvasHeight = window.innerHeight;
                canvas.width = canvasWidth;
                canvas.height = canvasHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', () => {
                resizeCanvas();
                initParticles();
            });

            class Particle {
                constructor() {
                    this.reset(true);
                }
                reset(initial = false) {
                    this.x = Math.random() * canvasWidth;
                    this.y = initial ? Math.random() * canvasHeight : Math.random() * canvasHeight;
                    this.size = Math.random() * 2.2 + 0.6;
                    this.baseOpacity = Math.random() * 0.5 + 0.2;
                    this.opacity = this.baseOpacity;
                    this.twinkleSpeed = Math.random() * 0.015 + 0.005;
                    this.twinkleOffset = Math.random() * Math.PI * 2;
                    this.driftX = (Math.random() - 0.5) * 0.25;
                    this.driftY = (Math.random() - 0.5) * 0.2 - 0.1;
                    // 暖金色调
                    const colorChoice = Math.random();
                    if (colorChoice < 0.5) {
                        this.r = 235 + Math.random() * 20;
                        this.g = 200 + Math.random() * 35;
                        this.b = 175 + Math.random() * 30;
                    } else if (colorChoice < 0.8) {
                        this.r = 245 + Math.random() * 10;
                        this.g = 225 + Math.random() * 20;
                        this.b = 200 + Math.random() * 30;
                    } else {
                        this.r = 220 + Math.random() * 30;
                        this.g = 185 + Math.random() * 25;
                        this.b = 160 + Math.random() * 25;
                    }
                }
                update(time) {
                    this.opacity = this.baseOpacity + Math.sin(time * this.twinkleSpeed + this.twinkleOffset) *
                        0.25;
                    this.opacity = Math.max(0.04, Math.min(0.75, this.opacity));
                    this.x += this.driftX;
                    this.y += this.driftY;
                    if (this.x < -20) this.x = canvasWidth + 20;
                    if (this.x > canvasWidth + 20) this.x = -20;
                    if (this.y < -20) this.y = canvasHeight + 20;
                    if (this.y > canvasHeight + 20) this.y = -20;
                }
                draw(ctx) {
                    ctx.save();
                    ctx.globalAlpha = this.opacity;
                    const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 6);
                    gradient.addColorStop(0, `rgba(${this.r},${this.g},${this.b},1)`);
                    gradient.addColorStop(0.25, `rgba(${this.r},${this.g},${this.b},0.6)`);
                    gradient.addColorStop(0.6, `rgba(${this.r},${this.g},${this.b},0.08)`);
                    gradient.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 6, 0, Math.PI * 2);
                    ctx.fill();
                    // 核心亮点
                    ctx.globalAlpha = this.opacity * 1.3;
                    const coreGrad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 1.5);
                    coreGrad.addColorStop(0, `rgba(255,248,240,0.9)`);
                    coreGrad.addColorStop(0.5, `rgba(${this.r},${this.g},${this.b},0.4)`);
                    coreGrad.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = coreGrad;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            function initParticles() {
                particles = [];
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    particles.push(new Particle());
                }
            }
            initParticles();

            let lastTime = performance.now();

            function animateParticles(timestamp) {
                const time = timestamp || performance.now();
                ctx.clearRect(0, 0, canvasWidth, canvasHeight);
                particles.forEach(p => {
                    p.update(time);
                    p.draw(ctx);
                });
                animationId = requestAnimationFrame(animateParticles);
                lastTime = time;
            }
            animationId = requestAnimationFrame(animateParticles);

            // ==================== 飘落花瓣生成 ====================
            const petalsLayer = document.getElementById('petalsLayer');
            const PETAL_COUNT = 18;
            const petalColors = [
                'rgba(220,185,170,0.7)',
                'rgba(235,205,190,0.65)',
                'rgba(210,175,160,0.6)',
                'rgba(240,215,200,0.7)',
                'rgba(225,190,175,0.55)',
                'rgba(245,225,210,0.6)',
                'rgba(215,180,165,0.65)',
                'rgba(230,200,185,0.5)',
            ];

            function createPetals() {
                petalsLayer.innerHTML = '';
                const fragment = document.createDocumentFragment();
                for (let i = 0; i < PETAL_COUNT; i++) {
                    const petal = document.createElement('div');
                    petal.classList.add('petal');
                    const size = Math.random() * 14 + 8;
                    petal.style.width = size + 'px';
                    petal.style.height = (size * 1.6) + 'px';
                    petal.style.left = Math.random() * 94 + '%';
                    petal.style.backgroundColor = petalColors[Math.floor(Math.random() * petalColors.length)];
                    petal.style.setProperty('--fall-duration', (Math.random() * 22 + 16) + 's');
                    petal.style.setProperty('--fall-delay', (Math.random() * 18) + 's');
                    petal.style.setProperty('--drift-1', (Math.random() * 40 - 20) + 'px');
                    petal.style.setProperty('--drift-2', (Math.random() * 60 - 30) + 'px');
                    petal.style.setProperty('--drift-3', (Math.random() * 80 - 40) + 'px');
                    petal.style.setProperty('--drift-4', (Math.random() * 70 - 35) + 'px');
                    petal.style.setProperty('--drift-5', (Math.random() * 50 - 25) + 'px');
                    petal.style.setProperty('--drift-6', (Math.random() * 30 - 15) + 'px');
                    petal.style.setProperty('--rot-1', (Math.random() * 120 - 60) + 'deg');
                    petal.style.setProperty('--rot-2', (Math.random() * 200 - 100) + 'deg');
                    petal.style.setProperty('--rot-3', (Math.random() * 280 - 140) + 'deg');
                    petal.style.setProperty('--rot-4', (Math.random() * 350 - 175) + 'deg');
                    petal.style.setProperty('--rot-5', (Math.random() * 420 - 210) + 'deg');
                    petal.style.setProperty('--rot-6', (Math.random() * 500 - 250) + 'deg');
                    petal.style.boxShadow = '0 0 6px rgba(220,185,165,0.3)';
                    fragment.appendChild(petal);
                }
                petalsLayer.appendChild(fragment);
            }
            createPetals();
            // 定期刷新花瓣（保持持续飘落）
            setInterval(() => {
                createPetals();
            }, 38000);

            // ==================== 鼠标跟踪：液态玻璃光影折射微动 ====================
            const glassCardWrapper = document.getElementById('glassCardWrapper');
            const glassCard = document.getElementById('glassCard');
            let mouseX = window.innerWidth / 2;
            let mouseY = window.innerHeight / 2;
            let targetMouseX = mouseX;
            let targetMouseY = mouseY;
            let currentRefractX = 0;
            let currentRefractY = 0;

            document.addEventListener('mousemove', (e) => {
                targetMouseX = e.clientX;
                targetMouseY = e.clientY;
            });

            // 触摸设备支持
            document.addEventListener('touchmove', (e) => {
                if (e.touches.length > 0) {
                    targetMouseX = e.touches[0].clientX;
                    targetMouseY = e.touches[0].clientY;
                }
            }, { passive: true });

            function updateRefraction() {
                // 平滑鼠标位置
                mouseX += (targetMouseX - mouseX) * 0.04;
                mouseY += (targetMouseY - mouseY) * 0.04;

                // 获取卡片在视口中的位置
                const cardRect = glassCardWrapper.getBoundingClientRect();
                const cardCenterX = cardRect.left + cardRect.width / 2;
                const cardCenterY = cardRect.top + cardRect.height / 2;

                // 计算鼠标相对卡片中心的偏移（归一化到 -1 到 1）
                const relX = (mouseX - cardCenterX) / (cardRect.width / 2);
                const relY = (mouseY - cardCenterY) / (cardRect.height / 2);
                const clampedX = Math.max(-1, Math.min(1, relX));
                const clampedY = Math.max(-1, Math.min(1, relY));

                // 平滑折射偏移
                currentRefractX += (clampedX * 8 - currentRefractX) * 0.06;
                currentRefractY += (clampedY * 6 - currentRefractY) * 0.06;

                // 更新卡片高光位置（通过CSS变量）
                const highlightX = 50 + currentRefractX * 1.5;
                const highlightY = 22 + currentRefractY * 1.2;
                glassCard.style.setProperty('--highlight-x', highlightX + '%');
                glassCard.style.setProperty('--highlight-y', highlightY + '%');

                // 更新流体光斑位置
                const fluidOrb1 = glassCard.querySelector('.fluid-orb-1');
                const fluidOrb2 = glassCard.querySelector('.fluid-orb-2');
                if (fluidOrb1) {
                    fluidOrb1.style.transform =
                        `translate(${currentRefractX * 0.6}px, ${currentRefractY * 0.5}px) scale(1.05)`;
                }
                if (fluidOrb2) {
                    fluidOrb2.style.transform =
                        `translate(${-currentRefractX * 0.45}px, ${-currentRefractY * 0.4}px) scale(1.04)`;
                }

                // 微调卡片整体光影（非常微妙）
                const shadowOffsetX = currentRefractX * 0.3;
                const shadowOffsetY = currentRefractY * 0.25;
                glassCard.style.boxShadow = `
                    0 ${8 + shadowOffsetY}px ${40 + Math.abs(currentRefractY) * 2}px rgba(0,0,0,0.35),
                    ${shadowOffsetX}px ${2 + shadowOffsetY}px ${12 + Math.abs(currentRefractX) * 1.5}px rgba(200,160,130,0.15),
                    0 0 0 1px var(--card-border),
                    inset ${-shadowOffsetX * 0.25}px ${1 - shadowOffsetY * 0.2}px 0 rgba(255,245,235,0.08)
                `;

                requestAnimationFrame(updateRefraction);
            }
            requestAnimationFrame(updateRefraction);

            // ==================== 窗口尺寸变化处理 ====================
            window.addEventListener('resize', () => {
                resizeCanvas();
                initParticles();
                // 重置折射偏移
                currentRefractX = 0;
                currentRefractY = 0;
            });

            // ==================== 页面可见性处理（优化性能） ====================
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    if (animationId) {
                        cancelAnimationFrame(animationId);
                        animationId = null;
                    }
                } else {
                    if (!animationId) {
                        lastTime = performance.now();
                        animationId = requestAnimationFrame(animateParticles);
                    }
                }
            });

            // ==================== 初始化完成日志 ====================
            console.log('%c🌸 母亲节液态玻璃全屏页面已就绪 %c| %c祝妈妈母亲节快乐 💐',
                'color: #e8c8c0; font-size: 14px;',
                '',
                'color: #d4beb6; font-size: 13px;');
            console.log('%c✨ 液态玻璃磨砂质感 · 流体波纹 · 粒子星光 · 飘落花瓣 · 鼠标光影折射',
                'color: #c4a8a0; font-size: 11px;');
        })();
    </script>
</body>
</html>
