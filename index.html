<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>手机横屏 FPS 射击游戏</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, "Microsoft YaHei", sans-serif;
}

#game {
    width: 100vw;
    height: 100vh;
    display: block;
    background: #111;
}

#menu {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: radial-gradient(circle, #26384f, #05070a);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
}

.panel {
    width: min(92vw, 560px);
    background: rgba(0,0,0,0.72);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 18px;
    padding: 22px;
}

.panel h1 {
    text-align: center;
    margin-bottom: 10px;
    font-size: 25px;
}

.panel p {
    color: #ccc;
    font-size: 14px;
    text-align: center;
    margin-bottom: 16px;
}

.option {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 13px 0;
    font-size: 15px;
}

.switch {
    width: 54px;
    height: 28px;
    border-radius: 20px;
    background: #555;
    position: relative;
}

.switch::after {
    content: "";
    position: absolute;
    width: 24px;
    height: 24px;
    top: 2px;
    left: 2px;
    background: white;
    border-radius: 50%;
    transition: 0.2s;
}

.switch.on {
    background: #18c964;
}

.switch.on::after {
    left: 28px;
}

select {
    background: #111;
    color: white;
    border: 1px solid #777;
    border-radius: 8px;
    padding: 6px 10px;
}

#startBtn {
    width: 100%;
    margin-top: 16px;
    padding: 13px;
    border-radius: 12px;
    border: none;
    color: white;
    font-size: 18px;
    background: linear-gradient(90deg, #008cff, #00cc88);
}

#hud {
    position: fixed;
    left: 12px;
    top: 10px;
    color: white;
    z-index: 8;
    font-size: 14px;
    line-height: 1.5;
    text-shadow: 0 0 4px #000;
}

#settingsBtn {
    position: fixed;
    right: 12px;
    top: 10px;
    z-index: 8;
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(255,255,255,0.35);
    color: white;
    padding: 7px 10px;
    border-radius: 8px;
}

#joyBase {
    position: fixed;
    left: 32px;
    bottom: 26px;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    z-index: 8;
    background: rgba(255,255,255,0.13);
    border: 2px solid rgba(255,255,255,0.35);
}

#joyStick {
    position: absolute;
    left: 39px;
    top: 39px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(255,255,255,0.58);
}

#shootBtn {
    position: fixed;
    right: 34px;
    bottom: 28px;
    width: 92px;
    height: 92px;
    border-radius: 50%;
    z-index: 8;
    background: rgba(255,50,50,0.7);
    border: 3px solid rgba(255,255,255,0.8);
    color: white;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
}

#shootBtn:active {
    transform: scale(0.95);
    background: rgba(255,0,0,0.95);
}

#landscapeTip {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    background: #000;
    color: white;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    text-align: center;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
    <div id="hpText">敌人生命：100</div>
    <div id="hitText">头部命中：0 / 3　身体命中：0 / 7</div>
    <div id="modeText"></div>
</div>

<button id="settingsBtn">功能</button>

<div id="joyBase">
    <div id="joyStick"></div>
</div>

<div id="shootBtn">射击</div>

<div id="menu">
    <div class="panel">
        <h1>第一人称射击训练场</h1>
        <p>左下角摇杆控制准星移动，右下角射击。掩体固定，敌人移动。</p>

        <div class="option">
            <span>人物透视：高亮敌人，可隔掩体观察</span>
            <div class="switch on" data-key="esp"></div>
        </div>

        <div class="option">
            <span>自动瞄准：准星自动吸附敌人</span>
            <div class="switch on" data-key="aimbot"></div>
        </div>

        <div class="option">
            <span>自动瞄准位置</span>
            <select id="lockPart">
                <option value="head">锁头</option>
                <option value="chest">锁胸</option>
            </select>
        </div>

        <div class="option">
            <span>子弹追踪：子弹拐弯追踪目标</span>
            <div class="switch on" data-key="homing"></div>
        </div>

        <button id="startBtn">开始游戏</button>
    </div>
</div>

<div id="landscapeTip">请横屏游玩</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const menu = document.getElementById("menu");
const startBtn = document.getElementById("startBtn");
const settingsBtn = document.getElementById("settingsBtn");
const shootBtn = document.getElementById("shootBtn");
const joyBase = document.getElementById("joyBase");
const joyStick = document.getElementById("joyStick");

const hpText = document.getElementById("hpText");
const hitText = document.getElementById("hitText");
const modeText = document.getElementById("modeText");
const lockPartSelect = document.getElementById("lockPart");
const landscapeTip = document.getElementById("landscapeTip");

let W = 0;
let H = 0;
let running = false;

const opts = {
    esp: true,
    aimbot: true,
    homing: true,
    lockPart: "head"
};

document.querySelectorAll(".switch").forEach(sw => {
    sw.addEventListener("click", () => {
        sw.classList.toggle("on");
        opts[sw.dataset.key] = sw.classList.contains("on");
    });
});

lockPartSelect.addEventListener("change", () => {
    opts.lockPart = lockPartSelect.value;
});

startBtn.onclick = () => {
    running = true;
    menu.style.display = "none";
};

settingsBtn.onclick = () => {
    running = false;
    menu.style.display = "flex";
};

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * devicePixelRatio;
    canvas.height = H * devicePixelRatio;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);

    crosshair.x = W / 2;
    crosshair.y = H / 2;

    landscapeTip.style.display = H > W ? "flex" : "none";
}

window.addEventListener("resize", resize);

const crosshair = {
    x: 0,
    y: 0
};

const joystick = {
    active: false,
    id: null,
    dx: 0,
    dy: 0
};

// 固定不动的掩体，屏幕坐标
const covers = [
    { x: 250, y: 260, w: 170, h: 155 },
    { x: 520, y: 245, w: 210, h: 170 },
    { x: 820, y: 275, w: 180, h: 145 }
];

// 敌人会移动
const enemy = {
    x: 540,
    y: 220,
    scale: 1,
    targetX: 540,
    targetY: 220,
    hp: 100,
    headHits: 0,
    bodyHits: 0,
    alive: true,
    moveTimer: 0,
    respawnTimer: 0
};

let bullets = [];
let texts = [];
let muzzleFlash = 0;
let shootCooldown = 0;

function resetEnemy() {
    enemy.x = W * (0.35 + Math.random() * 0.3);
    enemy.y = H * 0.36;
    enemy.targetX = enemy.x;
    enemy.targetY = enemy.y;
    enemy.hp = 100;
    enemy.headHits = 0;
    enemy.bodyHits = 0;
    enemy.alive = true;
    enemy.moveTimer = 0;
    enemy.respawnTimer = 0;
    chooseEnemyTarget();
}

function chooseEnemyTarget() {
    const useCover = Math.random() < 0.65;

    if (useCover) {
        const c = covers[Math.floor(Math.random() * covers.length)];
        enemy.targetX = c.x + c.w / 2 + (Math.random() - 0.5) * c.w * 0.6;
        enemy.targetY = c.y - 50 + Math.random() * 35;
    } else {
        enemy.targetX = W * (0.25 + Math.random() * 0.5);
        enemy.targetY = H * (0.28 + Math.random() * 0.12);
    }
}

function getScaledCover(c) {
    const sx = W / 1100;
    const sy = H / 620;
    return {
        x: c.x * sx,
        y: c.y * sy,
        w: c.w * sx,
        h: c.h * sy
    };
}

function getEnemyParts() {
    const bodyH = H * 0.30;
    const bodyW = bodyH * 0.32;
    const headR = bodyH * 0.11;

    const footY = enemy.y + bodyH;
    const headX = enemy.x;
    const headY = enemy.y + bodyH * 0.12;
    const chestX = enemy.x;
    const chestY = enemy.y + bodyH * 0.43;

    return {
        top: enemy.y,
        bottom: footY,
        width: bodyW,
        height: bodyH,
        head: {
            x: headX,
            y: headY,
            r: headR
        },
        chest: {
            x: chestX,
            y: chestY,
            w: bodyW * 0.55,
            h: bodyH * 0.20
        },
        body: {
            x: enemy.x - bodyW / 2,
            y: enemy.y + bodyH * 0.23,
            w: bodyW,
            h: bodyH * 0.55
        }
    };
}

function pointInCover(px, py) {
    for (const raw of covers) {
        const c = getScaledCover(raw);
        if (
            px >= c.x &&
            px <= c.x + c.w &&
            py >= c.y &&
            py <= c.y + c.h
        ) {
            return true;
        }
    }
    return false;
}

function updateEnemy(dt) {
    if (!enemy.alive) {
        enemy.respawnTimer += dt;
        if (enemy.respawnTimer > 1.4) {
            resetEnemy();
        }
        return;
    }

    enemy.moveTimer -= dt;

    if (enemy.moveTimer <= 0) {
        enemy.moveTimer = 0.9 + Math.random() * 1.4;
        chooseEnemyTarget();
    }

    const dx = enemy.targetX - enemy.x;
    const dy = enemy.targetY - enemy.y;
    const dist = Math.hypot(dx, dy);

    if (dist > 2) {
        const speed = 110;
        enemy.x += dx / dist * speed * dt;
        enemy.y += dy / dist * speed * dt;
    }
}

function updateAimbot(dt) {
    if (!opts.aimbot || !enemy.alive) return;

    const ep = getEnemyParts();
    const target = opts.lockPart === "head" ? ep.head : ep.chest;

    const dx = target.x - crosshair.x;
    const dy = target.y - crosshair.y;

    const range = Math.min(W, H) * 0.45;

    if (Math.hypot(dx, dy) < range) {
        crosshair.x += dx * dt * 5.5;
        crosshair.y += dy * dt * 5.5;
    }
}

function update(dt) {
    if (!running) return;

    updateEnemy(dt);

    // 关键修改：摇杆只控制准星，不控制场景和掩体
    const aimSpeed = 520;
    crosshair.x += joystick.dx * aimSpeed * dt;
    crosshair.y += joystick.dy * aimSpeed * dt;

    crosshair.x = Math.max(25, Math.min(W - 25, crosshair.x));
    crosshair.y = Math.max(25, Math.min(H - 25, crosshair.y));

    updateAimbot(dt);

    shootCooldown -= dt;
    muzzleFlash = Math.max(0, muzzleFlash - dt * 8);

    bullets.forEach(b => b.life -= dt);
    bullets = bullets.filter(b => b.life > 0);

    texts.forEach(t => {
        t.y -= dt * 38;
        t.life -= dt;
    });
    texts = texts.filter(t => t.life > 0);

    hpText.textContent = "敌人生命：" + Math.max(0, Math.round(enemy.hp));
    hitText.textContent = "头部命中：" + enemy.headHits + " / 3　身体命中：" + enemy.bodyHits + " / 7";
    modeText.textContent =
        "ESP：" + (opts.esp ? "开" : "关") +
        "　自动瞄准：" + (opts.aimbot ? "开" : "关") +
        "　锁定：" + (opts.lockPart === "head" ? "头部" : "胸口") +
        "　追踪弹：" + (opts.homing ? "开" : "关");
}

function fire() {
    if (!running || shootCooldown > 0) return;

    shootCooldown = 0.16;
    muzzleFlash = 1;

    const ep = getEnemyParts();

    let hit = false;
    let part = null;
    let tx = crosshair.x;
    let ty = crosshair.y;

    if (enemy.alive) {
        if (opts.homing) {
            // 追踪弹：直接拐弯命中当前锁定位置，可打掩体后露头
            if (opts.lockPart === "head") {
                tx = ep.head.x;
                ty = ep.head.y;
                part = "head";
            } else {
                tx = ep.chest.x;
                ty = ep.chest.y;
                part = "body";
            }
            hit = true;
        } else {
            const cx = crosshair.x;
            const cy = crosshair.y;

            const inHead = Math.hypot(cx - ep.head.x, cy - ep.head.y) <= ep.head.r;

            const inBody =
                cx >= ep.chest.x - ep.chest.w &&
                cx <= ep.chest.x + ep.chest.w &&
                cy >= ep.chest.y - ep.chest.h &&
                cy <= ep.chest.y + ep.chest.h;

            if (inHead && !pointInCover(cx, cy)) {
                hit = true;
                part = "head";
                tx = ep.head.x;
                ty = ep.head.y;
            } else if (inBody && !pointInCover(cx, cy)) {
                hit = true;
                part = "body";
                tx = ep.chest.x;
                ty = ep.chest.y;
            }
        }
    }

    bullets.push({
        x1: W * 0.72,
        y1: H * 0.78,
        x2: hit ? tx : crosshair.x + (Math.random() - 0.5) * 100,
        y2: hit ? ty : crosshair.y + (Math.random() - 0.5) * 100,
        life: 0.09,
        homing: opts.homing && hit
    });

    if (hit) {
        damage(part);
    } else {
        addText("未命中", "#ddd", crosshair.x, crosshair.y - 25);
    }
}

function damage(part) {
    if (!enemy.alive) return;

    if (part === "head") {
        enemy.headHits++;
        enemy.hp -= 34;
        addText("爆头 +34", "#ff3333", enemy.x, enemy.y - 20);
    } else {
        enemy.bodyHits++;
        enemy.hp -= 15;
        addText("命中 +15", "#ffd34d", enemy.x, enemy.y + 45);
    }

    if (enemy.hp <= 0) {
        enemy.hp = 0;
        enemy.alive = false;
        enemy.respawnTimer = 0;
        addText("敌人倒下", "#66ff66", enemy.x, enemy.y);
    }
}

function addText(text, color, x, y) {
    texts.push({
        text,
        color,
        x,
        y,
        life: 0.9
    });
}

shootBtn.addEventListener("pointerdown", e => {
    e.preventDefault();
    fire();
});

joyBase.addEventListener("pointerdown", e => {
    const rect = joyBase.getBoundingClientRect();
    joystick.active = true;
    joystick.id = e.pointerId;
    updateJoystick(e.clientX, e.clientY, rect);
});

window.addEventListener("pointermove", e => {
    if (!joystick.active || e.pointerId !== joystick.id) return;
    const rect = joyBase.getBoundingClientRect();
    updateJoystick(e.clientX, e.clientY, rect);
});

window.addEventListener("pointerup", e => {
    if (e.pointerId === joystick.id) {
        joystick.active = false;
        joystick.id = null;
        joystick.dx = 0;
        joystick.dy = 0;
        joyStick.style.left = "39px";
        joyStick.style.top = "39px";
    }
});

function updateJoystick(clientX, clientY, rect) {
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    let dx = clientX - cx;
    let dy = clientY - cy;

    const max = rect.width / 2 - 26;
    const len = Math.hypot(dx, dy);

    if (len > max) {
        dx = dx / len * max;
        dy = dy / len * max;
    }

    joystick.dx = dx / max;
    joystick.dy = dy / max;

    joyStick.style.left = 39 + dx + "px";
    joyStick.style.top = 39 + dy + "px";
}

function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, H * 0.55);
    sky.addColorStop(0, "#22537e");
    sky.addColorStop(1, "#9bc8e8");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H * 0.55);

    const ground = ctx.createLinearGradient(0, H * 0.55, 0, H);
    ground.addColorStop(0, "#3f4b3e");
    ground.addColorStop(1, "#171b16");
    ctx.fillStyle = ground;
    ctx.fillRect(0, H * 0.55, W, H * 0.45);

    ctx.strokeStyle = "rgba(255,255,255,0.08)";
    for (let i = 0; i < 14; i++) {
        const y = H * 0.56 + i * H * 0.035;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
    }
}

function drawEnemy() {
    if (!enemy.alive) return;

    const ep = getEnemyParts();

    const headCovered = pointInCover(ep.head.x, ep.head.y);
    const chestCovered = pointInCover(ep.chest.x, ep.chest.y);

    ctx.save();

    // 身体
    ctx.fillStyle = "#24385c";
    ctx.fillRect(ep.body.x, ep.body.y, ep.body.w, ep.body.h);

    // 头部
    ctx.fillStyle = "#d6a06f";
    ctx.beginPath();
    ctx.arc(ep.head.x, ep.head.y, ep.head.r, 0, Math.PI * 2);
    ctx.fill();

    // 腿
    ctx.strokeStyle = "#172238";
    ctx.lineWidth = Math.max(4, ep.width * 0.12);
    ctx.beginPath();
    ctx.moveTo(enemy.x - ep.width * 0.22, ep.body.y + ep.body.h);
    ctx.lineTo(enemy.x - ep.width * 0.35, ep.bottom + 10);
    ctx.moveTo(enemy.x + ep.width * 0.22, ep.body.y + ep.body.h);
    ctx.lineTo(enemy.x + ep.width * 0.35, ep.bottom + 10);
    ctx.stroke();

    // 手和枪
    ctx.strokeStyle = "#111";
    ctx.lineWidth = Math.max(4, ep.width * 0.09);
    ctx.beginPath();
    ctx.moveTo(enemy.x + ep.width * 0.2, ep.body.y + ep.body.h * 0.25);
    ctx.lineTo(enemy.x + ep.width * 0.9, ep.body.y + ep.body.h * 0.15);
    ctx.stroke();

    ctx.restore();
}

function drawCovers() {
    covers.forEach(raw => {
        const c = getScaledCover(raw);

        ctx.fillStyle = "#5e5548";
        ctx.fillRect(c.x, c.y, c.w, c.h);

        ctx.strokeStyle = "#2a241f";
        ctx.lineWidth = 3;
        ctx.strokeRect(c.x, c.y, c.w, c.h);

        ctx.fillStyle = "rgba(255,255,255,0.08)";
        ctx.fillRect(c.x, c.y, c.w, 8);
    });
}

function drawESP() {
    if (!opts.esp || !enemy.alive) return;

    const ep = getEnemyParts();
    const headCovered = pointInCover(ep.head.x, ep.head.y);
    const chestCovered = pointInCover(ep.chest.x, ep.chest.y);
    const covered = headCovered || chestCovered;

    ctx.save();
    ctx.shadowBlur = 18;
    ctx.shadowColor = covered ? "#00eaff" : "#ff4040";
    ctx.strokeStyle = covered ? "#00eaff" : "#ff4040";
    ctx.lineWidth = 2;

    ctx.strokeRect(
        enemy.x - ep.width * 0.75,
        ep.top - 18,
        ep.width * 1.5,
        ep.height + 34
    );

    ctx.fillStyle = covered ? "#00eaff" : "#ff4040";
    ctx.font = "13px Arial";
    ctx.textAlign = "center";
    ctx.fillText(covered ? "敌人：掩体后" : "敌人：可视", enemy.x, ep.top - 25);

    ctx.restore();
}

function drawCrosshair() {
    const x = crosshair.x;
    const y = crosshair.y;

    ctx.save();

    ctx.strokeStyle = "rgba(255,255,255,0.95)";
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(x - 22, y);
    ctx.lineTo(x - 8, y);
    ctx.moveTo(x + 8, y);
    ctx.lineTo(x + 22, y);
    ctx.moveTo(x, y - 22);
    ctx.lineTo(x, y - 8);
    ctx.moveTo(x, y + 8);
    ctx.lineTo(x, y + 22);
    ctx.stroke();

    ctx.strokeStyle = "rgba(0,255,120,0.9)";
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.stroke();

    ctx.restore();
}

function drawBullets() {
    bullets.forEach(b => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, b.life / 0.09);
        ctx.strokeStyle = b.homing ? "#00fff2" : "#fff06a";
        ctx.lineWidth = b.homing ? 4 : 3;

        ctx.beginPath();

        if (b.homing) {
            const mx = (b.x1 + b.x2) / 2;
            const my = Math.min(b.y1, b.y2) - 80;
            ctx.moveTo(b.x1, b.y1);
            ctx.quadraticCurveTo(mx, my, b.x2, b.y2);
        } else {
            ctx.moveTo(b.x1, b.y1);
            ctx.lineTo(b.x2, b.y2);
        }

        ctx.stroke();
        ctx.restore();
    });

    if (muzzleFlash > 0) {
        ctx.save();
        ctx.globalAlpha = muzzleFlash;
        ctx.fillStyle = "rgba(255,230,80,0.65)";
        ctx.beginPath();
        ctx.arc(W * 0.72, H * 0.78, 30, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

function drawWeapon() {
    ctx.save();
    ctx.translate(W * 0.62, H * 0.76);

    ctx.fillStyle = "#222";
    ctx.fillRect(0, 0, W * 0.25, H * 0.08);

    ctx.fillStyle = "#111";
    ctx.fillRect(W * 0.18, -H * 0.025, W * 0.13, H * 0.04);

    ctx.fillStyle = "#555";
    ctx.fillRect(W * 0.04, H * 0.05, W * 0.09, H * 0.16);

    ctx.fillStyle = "#333";
    ctx.fillRect(-W * 0.03, H * 0.03, W * 0.09, H * 0.06);

    ctx.restore();
}

function drawTexts() {
    ctx.font = "bold 22px Arial";
    ctx.textAlign = "center";

    texts.forEach(t => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, t.life);
        ctx.strokeStyle = "black";
        ctx.lineWidth = 4;
        ctx.fillStyle = t.color;
        ctx.strokeText(t.text, t.x, t.y);
        ctx.fillText(t.text, t.x, t.y);
        ctx.restore();
    });
}

function render() {
    ctx.clearRect(0, 0, W, H);

    drawBackground();

    // 先画敌人，再画掩体，这样掩体能真正挡住敌人
    drawEnemy();
    drawCovers();

    // ESP 在掩体之后画，所以可以隔掩体观察
    drawESP();

    drawBullets();
    drawWeapon();
    drawCrosshair();
    drawTexts();

    if (!running) {
        ctx.fillStyle = "rgba(0,0,0,0.25)";
        ctx.fillRect(0, 0, W, H);
    }
}

let last = performance.now();

function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;

    update(dt);
    render();

    requestAnimationFrame(loop);
}

resize();
resetEnemy();
requestAnimationFrame(loop);
</script>
</body>
</html>
